[tasks]
test.sequence = [
    { cmd = "cargo clippy" },
    { shell = "PYTHONHOME=$(python -c 'import sys; print(sys.base_prefix)') cargo nextest run --workspace --all-features -E 'not (package(ruff_python_parser) & (binary(fixtures) | binary(generate_inline_tests)))'" },
    { cmd = "pytest" },
]
bench.sequence = [
    { cmd = "pytest --codspeed --codspeed-warmup-time=5 tests/bench.py" },
    { cmd = "pytest tests/bench.py::test_parse_file --memray" },
    { cmd = "pytest tests/bench.py::test_xonsh_ply --memray" },
    { cmd = "cargo bench" },
]
pull-ruff-crates.sequence = [
    { script = "tasks.tasks:pull_ruff_crates" },
    { cmd = "cargo build" },
]
generate-ci = "maturin generate-ci github -o .github/workflows/CI.yml"
hyperfine-bench.sequence = [
    { cmd = "mkdir -p .benchmarks" },
    { cmd = "maturin develop --release" },
    { script = "tasks.hyper_bench.create_fixture:main" },
    { shell = "hyperfine --warmup 1 'uv run python tasks/hyper_bench/rd.py' 'uv run python tasks/hyper_bench/xply.py' --export-markdown .benchmarks/bench-$(date +%Y.%m.%d.%H:%M).md" },
]
