[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "xonsh_rd_parser"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
description = "A Rust based, recursive descent parser for Xonsh"
readme = "README.md"

[dependency-groups]
dev = [
    "pip",
    "pytest>=8.2.2",
    "maturin-import-hook>=0.1.0",
    "pytest-codspeed",
    "pytest-memray",
    #    "pytest-insta",
    "psutil",
    "inline-snapshot",
    "ruamel.yaml",
    "tomlkit",
    "packaging",
    "xonsh>=0.19.9",
]
[tool.maturin]
features = ["pyo3/extension-module"]
profile = "release"

[tool.maturin.generate-ci.github]
trusted-publishing = true
#zig = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["crates", "tests/data"]

[tool.ruff.lint]
ignore = [
    "E402", # top level imports
]

[tool.poe]
include = "poe_tasks.toml"
